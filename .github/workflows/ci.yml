name: GearLane CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gearlane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run domain, API and database tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify preview workflows
        run: npm run test:browser
      - name: Verify responsive layouts and guided flows
        run: npm run test:responsive
      - name: Verify chat delivery and five-second sync
        run: npm run test:chat
      - name: Verify responsive seller-chat window
        run: npm run test:chat-ui
      - name: Verify conversation history and enquiry creation
        run: npm run test:chat-inbox
      - name: Verify customer discovery and feedback states
        run: npm run test:experience
      - name: Verify promotion banners and scoped loading
        run: npm run test:banners
      - name: Verify design system, reviews, promo privacy and phone header
        run: npm run test:design
      - name: Verify garage, address book, product questions and PDF invoices
        run: npm run test:profile
      - name: Verify order tracking, order lists, cart helpers and the staff home screens
        run: npm run test:ux
      - name: Verify vehicle finder, stock alerts, SEO metadata and comparison labels
        run: npm run test:features
      - name: Verify behaviour with a large catalogue and order history
        run: npm run test:load
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
